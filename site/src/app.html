<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Compare Jetpack Compose BOM versions and see exactly what changed across all libraries." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://compose-bom.com" />
    <meta property="og:title" content="Compose BOM Changelog" />
    <meta property="og:description" content="Compare Jetpack Compose BOM versions and see exactly what changed across all libraries." />
    <meta property="og:image" content="https://compose-bom.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Compose BOM Changelog" />
    <meta name="twitter:description" content="Compare Jetpack Compose BOM versions and see exactly what changed across all libraries." />
    <meta name="twitter:image" content="https://compose-bom.com/og-image.png" />

    <title>Compose BOM Changelog</title>
    <script>
      const t = localStorage.getItem('theme')
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t
    </script>
    %sveltekit.head%
    <script data-goatcounter="https://keymusicman.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
