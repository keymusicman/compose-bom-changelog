name: Add whats_new entry

on:
  workflow_dispatch:
    inputs:
      bom_version:
        description: 'BOM version (e.g. 2026.05.00)'
        required: true
      page_url:
        description: 'URL of the release page or blog post'
        required: true
      summary:
        description: 'Optional summary text'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  add-whats-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Add whats_new entry
        run: |
          python collector/add_whats_new.py \
            "${{ github.event.inputs.bom_version }}" \
            "${{ github.event.inputs.page_url }}" \
            --summary "${{ github.event.inputs.summary }}"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bom-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: add whats_new for ${{ github.event.inputs.bom_version }} [skip ci]"
            git push
          fi
